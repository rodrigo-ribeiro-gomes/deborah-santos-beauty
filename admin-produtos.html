<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar produto</title>
    <style>
        :root {
            --bg: #09050b;
            --surface: rgba(20, 11, 24, 0.92);
            --text: #fff3f8;
            --muted: #d4b8c7;
            --primary: #ff4fa0;
            --primary-dark: #d91f79;
            --accent-gold: #f2c17b;
            --border: rgba(242, 193, 123, 0.48);
            --border-soft: rgba(255, 214, 153, 0.22);
            --shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(255, 79, 160, 0.18), transparent 30%),
                radial-gradient(circle at top right, rgba(82, 168, 255, 0.15), transparent 28%),
                radial-gradient(circle at bottom center, rgba(242, 193, 123, 0.10), transparent 35%),
                var(--bg);
        }

        .container {
            width: min(920px, calc(100% - 32px));
            margin: 0 auto;
            padding: 42px 0 56px;
        }

        .panel {
            background:
                linear-gradient(180deg, rgba(255, 79, 160, 0.10), transparent 45%),
                linear-gradient(135deg, rgba(82, 168, 255, 0.07), transparent 32%),
                var(--surface);
            border: 1px solid var(--border);
            border-radius: 22px;
            box-shadow: 0 0 0 1px var(--border-soft), var(--shadow);
            padding: 28px;
        }

        .badge {
            display: inline-block;
            margin: 0 0 12px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(255, 79, 160, 0.16);
            color: #ffd2e8;
            font-size: 0.9rem;
        }

        h1 {
            margin: 0 0 10px;
            font-size: clamp(2rem, 5vw, 3rem);
        }

        p {
            margin-top: 0;
            color: var(--muted);
        }

        form {
            display: grid;
            gap: 14px;
            margin-top: 24px;
        }

        input,
        textarea,
        select {
            width: 100%;
            border: 1px solid rgba(242, 193, 123, 0.35);
            border-radius: 14px;
            background: rgba(9, 5, 11, 0.72);
            color: var(--text);
            padding: 14px 16px;
            font: inherit;
            outline: none;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input::placeholder,
        textarea::placeholder {
            color: #bfa8b9;
        }

        input:focus,
        textarea:focus,
        select:focus {
            border-color: rgba(242, 193, 123, 0.7);
            box-shadow: 0 0 0 3px rgba(242, 193, 123, 0.14);
        }

        button {
            border: 0;
            border-radius: 14px;
            padding: 14px 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06), 0 10px 24px rgba(255, 79, 160, 0.28);
        }

        button:hover {
            background: linear-gradient(135deg, #ff68af, var(--primary-dark));
        }

        #mensagem {
            margin-top: 18px;
            min-height: 1.4em;
            color: var(--accent-gold);
            font-weight: 700;
        }

        @media (max-width: 640px) {
            .container {
                width: min(920px, calc(100% - 20px));
                padding: 18px 0 28px;
            }

            .panel {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <section class="panel">
            <span class="badge">Área administrativa</span>
            <h1>Novo produto</h1>
            <p>Cadastre itens para a loja usando a mesma identidade visual do site principal.</p>

            <form id="produto-form">
                <input id="nome" placeholder="Nome do produto" required>

                <textarea
                    id="descricao"
                    placeholder="Descrição"
                ></textarea>

                <input
                    id="preco"
                    type="number"
                    step="0.01"
                    min="0.01"
                    placeholder="Preço"
                    required
                >

                <select id="categoria" required>
                    <option value="">Selecione a categoria</option>
                    <option value="Beleza">Produtos de beleza</option>
                    <option value="Perfumes">Perfumes</option>
                    <option value="Kits">Kits para presentes</option>
                </select>

                <input
                    id="estoque"
                    type="number"
                    min="0"
                    placeholder="Quantidade em estoque"
                    required
                >

                <input
                    id="imagemUrl"
                    type="url"
                    placeholder="Endereço da imagem"
                >

                <button type="submit">Cadastrar produto</button>
            </form>

            <p id="mensagem"></p>
        </section>
    </main>

    <script src="admin-produtos.js"></script>

</body>
</html>
